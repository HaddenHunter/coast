name: Update Pricing Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  update-pricing:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          BRANCH="${BRANCH_NAME:-$DEFAULT_BRANCH}"
          git clone --depth=1 --branch "$BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Check runtime
        run: |
          set -eu
          cd repo
          node --version
          npm --version

      - name: Update pricing snapshot
        run: |
          set -eu
          cd repo
          npm run update:pricing

      - name: Commit and push snapshot
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          cd repo
          BRANCH="${BRANCH_NAME:-$DEFAULT_BRANCH}"
          if git diff --quiet -- cost/pricing.json; then
            echo "No pricing changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cost/pricing.json
          git commit -m "chore: refresh pricing snapshot"
          git push origin "HEAD:${BRANCH}"
