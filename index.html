<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>www.c8.fit</title>
  <meta name="description" content="Interactive panda landing page for www.c8.fit.">
  <style>
    :root {
      --bg: #eef3f9;
      --bg-2: #f7fbff;
      --line: rgba(37, 71, 112, 0.12);
      --line-strong: rgba(37, 71, 112, 0.22);
      --text: #0b1a30;
      --muted: rgba(11, 26, 48, 0.64);
      --glow-x: 50%;
      --glow-y: 44%;
      --rotate-x: 0deg;
      --rotate-y: 0deg;
      --shift-x: 0px;
      --shift-y: 0px;
      --shadow: 0 48px 120px rgba(24, 48, 92, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 18%, rgba(92, 153, 255, 0.18), transparent 22%),
        radial-gradient(circle at 50% 86%, rgba(74, 127, 255, 0.12), transparent 28%),
        radial-gradient(circle at 10% 16%, rgba(149, 225, 255, 0.16), transparent 20%),
        radial-gradient(circle at 86% 12%, rgba(200, 227, 255, 0.44), transparent 24%),
        linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 100%);
      overflow: hidden;
    }

    body {
      position: relative;
      color: var(--text);
      font: 15px/1.4 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(45, 78, 119, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(45, 78, 119, 0.05) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: radial-gradient(circle at center, black 28%, transparent 72%);
      opacity: 0.42;
    }

    body::after {
      content: "";
      position: absolute;
      inset: auto 8% -24% 8%;
      height: 56%;
      pointer-events: none;
      background:
        radial-gradient(ellipse at center, rgba(41, 86, 140, 0.16) 0%, rgba(41, 86, 140, 0.08) 26%, transparent 66%);
      filter: blur(18px);
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 20px;
    }

    .scene {
      position: relative;
      width: min(100%, 1400px);
      height: min(88vh, 980px);
      perspective: 2200px;
    }

    .stage {
      position: absolute;
      inset: 0;
      border-radius: 40px;
      transform-style: preserve-3d;
      transform: rotateX(var(--rotate-x)) rotateY(var(--rotate-y));
      transition: transform 160ms ease-out;
    }

    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 40px;
      pointer-events: none;
    }

    .stage::before {
      background:
        radial-gradient(circle at var(--glow-x) var(--glow-y), rgba(164, 213, 255, 0.28), transparent 18%),
        radial-gradient(circle at 50% 68%, rgba(81, 125, 241, 0.16), transparent 28%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.24), rgba(214, 225, 242, 0.56));
      filter: blur(2px);
    }

    .stage::after {
      inset: 5% 7%;
      border: 1px solid var(--line);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.48), var(--shadow);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.84), rgba(233, 241, 252, 0.54)),
        rgba(244, 248, 253, 0.74);
      backdrop-filter: blur(12px);
      transform: translateZ(-10px);
    }

    .halo {
      position: absolute;
      inset: 18% 23% 15%;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(137, 191, 255, 0.2), rgba(137, 191, 255, 0.08) 34%, transparent 64%);
      filter: blur(16px);
      transform: translate3d(calc(var(--shift-x) * 0.2), calc(var(--shift-y) * 0.2), -120px);
      transition: transform 180ms ease-out;
      pointer-events: none;
    }

    .ring {
      position: absolute;
      left: 50%;
      top: 50%;
      border-radius: 999px;
      border: 1px solid rgba(56, 103, 168, 0.18);
      transform-style: preserve-3d;
      pointer-events: none;
      box-shadow: 0 0 32px rgba(72, 110, 255, 0.08), inset 0 0 16px rgba(159, 215, 255, 0.06);
    }

    .ring.one {
      width: 760px;
      height: 760px;
      margin-left: -380px;
      margin-top: -380px;
      transform: rotateX(78deg) rotateZ(0deg) translateZ(-120px);
      animation: spin-a 24s linear infinite;
    }

    .ring.two {
      width: 620px;
      height: 620px;
      margin-left: -310px;
      margin-top: -310px;
      border-color: rgba(104, 139, 214, 0.2);
      transform: rotateY(72deg) rotateZ(0deg) translateZ(80px);
      animation: spin-b 18s linear infinite reverse;
    }

    .ring.three {
      width: 820px;
      height: 280px;
      margin-left: -410px;
      margin-top: -20px;
      transform: rotateX(82deg) translateZ(-80px);
      opacity: 0.72;
      animation: pulse 6.2s ease-in-out infinite;
    }

    .viewer-shell {
      position: absolute;
      inset: 8% 10% 12%;
      display: grid;
      place-items: center;
      transform-style: preserve-3d;
      transform: translate3d(calc(var(--shift-x) * 0.6), calc(var(--shift-y) * 0.6), 120px);
      transition: transform 160ms ease-out;
    }

    .panda-preview {
      position: absolute;
      width: min(78vw, 860px);
      max-width: 72%;
      aspect-ratio: 1;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 36px 70px rgba(26, 47, 87, 0.18));
      transform: translateZ(80px) scale(1.02);
      transition: opacity 220ms ease;
      z-index: 0;
    }

    model-viewer {
      width: min(92vw, 1100px);
      height: min(78vh, 820px);
      background: transparent;
      --poster-color: transparent;
      filter: drop-shadow(0 30px 64px rgba(26, 47, 87, 0.16));
      z-index: 1;
    }

    .glare {
      position: absolute;
      inset: 12% 18% 24%;
      border-radius: 42px;
      background:
        radial-gradient(circle at var(--glow-x) var(--glow-y), rgba(255, 255, 255, 0.62), transparent 18%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.18), transparent 38%);
      mix-blend-mode: screen;
      opacity: 0.72;
      pointer-events: none;
      transform: translateZ(140px);
    }

    .footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18px;
      display: flex;
      justify-content: center;
      z-index: 2;
      pointer-events: none;
    }

    .footer a {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 24px;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      background: rgba(11, 23, 43, 0.7);
      color: #f6fbff;
      text-decoration: none;
      font-size: clamp(18px, 2vw, 24px);
      letter-spacing: 0.1em;
      text-transform: lowercase;
      backdrop-filter: blur(14px);
      box-shadow: 0 18px 48px rgba(24, 48, 92, 0.16);
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .footer a:hover {
      transform: translateY(-2px) scale(1.015);
      border-color: rgba(61, 115, 191, 0.42);
      box-shadow: 0 24px 60px rgba(72, 110, 255, 0.16);
    }

    @keyframes spin-a {
      from { transform: rotateX(78deg) rotateZ(0deg) translateZ(-120px); }
      to { transform: rotateX(78deg) rotateZ(360deg) translateZ(-120px); }
    }

    @keyframes spin-b {
      from { transform: rotateY(72deg) rotateZ(0deg) translateZ(80px); }
      to { transform: rotateY(72deg) rotateZ(360deg) translateZ(80px); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.45; transform: rotateX(82deg) translateZ(-80px) scale(0.98); }
      50% { opacity: 0.84; transform: rotateX(82deg) translateZ(-80px) scale(1.03); }
    }

    @media (max-width: 900px) {
      .scene {
        height: min(82vh, 760px);
      }

      .viewer-shell {
        inset: 10% 4% 16%;
      }

      .panda-preview {
        max-width: 90%;
      }

      model-viewer {
        width: 100%;
        height: min(72vh, 680px);
      }

      .ring.one {
        width: 560px;
        height: 560px;
        margin-left: -280px;
        margin-top: -280px;
      }

      .ring.two {
        width: 460px;
        height: 460px;
        margin-left: -230px;
        margin-top: -230px;
      }

      .ring.three {
        width: 620px;
        height: 220px;
        margin-left: -310px;
      }
    }

    @media (max-width: 640px) {
      .page {
        padding: 8px;
      }

      .scene {
        width: 100%;
        height: 80vh;
      }

      .stage::after {
        inset: 2%;
        border-radius: 28px;
      }

      .footer {
        bottom: 14px;
      }

      .footer a {
        min-height: 48px;
        padding: 0 20px;
        font-size: 18px;
      }
    }
  </style>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
  <main class="page">
    <section class="scene" id="scene">
      <div class="stage" id="stage">
        <div class="halo"></div>
        <div class="ring one"></div>
        <div class="ring two"></div>
        <div class="ring three"></div>
        <div class="viewer-shell" id="viewerShell">
          <img
            class="panda-preview"
            id="pandaPreview"
            src="/assets/panda-preview.png"
            alt="Panda preview">
          <model-viewer
            id="panda"
            src="/assets/panda.glb"
            alt="Interactive panda"
            camera-controls
            auto-rotate
            auto-rotate-delay="0"
            rotation-per-second="18deg"
            shadow-intensity="1.2"
            shadow-softness="0.9"
            exposure="1.08"
            environment-image="neutral"
            interaction-prompt="none"
            min-camera-orbit="auto 58deg auto"
            max-camera-orbit="auto 102deg auto"
            camera-orbit="0deg 82deg 92%"
            field-of-view="28deg">
          </model-viewer>
          <div class="glare"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <a href="https://c8software.com" target="_blank" rel="noreferrer">c8software.com</a>
  </footer>

  <script>
    const root = document.documentElement;
    const scene = document.getElementById("scene");
    const viewerShell = document.getElementById("viewerShell");
    const panda = document.getElementById("panda");
    const pandaPreview = document.getElementById("pandaPreview");
    let raf = null;
    let targetX = 0;
    let targetY = 0;

    function applyMotion() {
      raf = null;
      const rotateY = targetX * 10;
      const rotateX = targetY * -8;
      const shiftX = targetX * 24;
      const shiftY = targetY * 24;

      root.style.setProperty("--rotate-y", rotateY.toFixed(2) + "deg");
      root.style.setProperty("--rotate-x", rotateX.toFixed(2) + "deg");
      root.style.setProperty("--shift-x", shiftX.toFixed(2) + "px");
      root.style.setProperty("--shift-y", shiftY.toFixed(2) + "px");
      root.style.setProperty("--glow-x", (50 + targetX * 18).toFixed(2) + "%");
      root.style.setProperty("--glow-y", (44 + targetY * 14).toFixed(2) + "%");
    }

    function queueMotion(x, y) {
      targetX = x;
      targetY = y;
      if (!raf) {
        raf = requestAnimationFrame(applyMotion);
      }
    }

    scene.addEventListener("pointermove", (event) => {
      const rect = scene.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      const y = ((event.clientY - rect.top) / rect.height) * 2 - 1;
      queueMotion(x, y);
    });

    scene.addEventListener("pointerleave", () => {
      queueMotion(0, 0);
    });

    scene.addEventListener("click", () => {
      viewerShell.animate(
        [
          { transform: "translate3d(calc(var(--shift-x) * 0.6), calc(var(--shift-y) * 0.6), 120px) scale(1)" },
          { transform: "translate3d(calc(var(--shift-x) * 0.6), calc(var(--shift-y) * 0.6), 120px) scale(1.035)" },
          { transform: "translate3d(calc(var(--shift-x) * 0.6), calc(var(--shift-y) * 0.6), 120px) scale(1)" }
        ],
        { duration: 480, easing: "ease-out" }
      );
    });

    panda.addEventListener("load", () => {
      pandaPreview.style.opacity = "0";
      window.setTimeout(() => {
        pandaPreview.style.display = "none";
      }, 260);
      panda.dismissPoster();
    });

    panda.addEventListener("error", () => {
      pandaPreview.style.display = "";
      pandaPreview.style.opacity = "1";
    });
  </script>
</body>
</html>
