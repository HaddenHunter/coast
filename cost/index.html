<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>c8.fit/cost · LLM Token 成本计算器</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --line: #30363d;
      --txt: #e6edf3;
      --mut: #8b949e;
      --acc: #2f81f7;
      --good-bg: #142d1d;
      --good-txt: #6ddf7e;
      --warn-bg: #2a2410;
      --warn-line: #d29922;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      background: radial-gradient(circle at top, #122033 0%, var(--bg) 28%);
      color: var(--txt);
      font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .wrap {
      max-width: 840px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 24px;
    }

    .sub {
      margin: 0 0 24px;
      color: var(--mut);
    }

    .card {
      margin-bottom: 16px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: color-mix(in srgb, var(--card) 92%, #0b1320 8%);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.24);
    }

    .headline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(47, 129, 247, 0.35);
      color: #9bc1ff;
      background: rgba(47, 129, 247, 0.08);
      font-size: 12px;
    }

    label {
      display: block;
      margin: 10px 0 4px;
      color: var(--mut);
    }

    select,
    input,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #0d1117;
      color: var(--txt);
      font: inherit;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    select:focus,
    input:focus,
    textarea:focus {
      outline: 2px solid rgba(47, 129, 247, 0.4);
      outline-offset: 1px;
      border-color: rgba(47, 129, 247, 0.65);
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row > div {
      flex: 1;
    }

    .hint {
      margin-top: 6px;
      color: var(--mut);
      font-size: 12px;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      color: var(--mut);
    }

    .toggle input {
      width: auto;
      margin: 0;
    }

    .out {
      font-size: 13px;
    }

    .out b {
      color: var(--acc);
    }

    .meta {
      margin-top: 10px;
      color: var(--mut);
      font-size: 12px;
    }

    .warn {
      margin-top: 14px;
      padding: 8px 12px;
      border-left: 3px solid var(--warn-line);
      border-radius: 6px;
      background: var(--warn-bg);
      color: #f0d58a;
      font-size: 12.5px;
    }

    .free {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--good-bg);
      color: var(--good-txt);
      font-size: 11px;
    }

    a {
      color: var(--acc);
    }

    @media (max-width: 720px) {
      body {
        padding-top: 24px;
      }

      .headline,
      .row {
        display: block;
      }

      .headline .badge {
        margin-top: 8px;
      }

      .row > div + div {
        margin-top: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="headline">
      <div>
        <h1>c8.fit/cost</h1>
        <p class="sub">LLM Token 成本计算器 · 粘贴文本估算 input/output · 标注 CoT / cache 陷阱 · 纯前端无上传</p>
      </div>
      <span class="badge">静态页 · 零后端 · 零密钥</span>
    </div>

    <div class="card">
      <label for="modelSearch">搜索模型 / 厂商</label>
      <input id="modelSearch" type="text" placeholder="例如 openai / gemini / deepseek / qwen">

      <label for="model">选择模型</label>
      <select id="model" aria-label="选择模型"></select>

      <div class="row">
        <div>
          <label for="inp">输入文本</label>
          <textarea id="inp" rows="4" placeholder="粘贴 system + user prompt…"></textarea>
          <div class="hint">不上传内容，仅在本地按字符数估算 token。</div>
        </div>
        <div>
          <label for="inputTok">或直接填写 input token 数</label>
          <input id="inputTok" type="number" min="0" value="0">
          <label for="outTok">预估输出 token 数</label>
          <input id="outTok" type="number" min="0" value="500">
        </div>
      </div>

      <div class="row">
        <div>
          <label for="calls">每月调用次数</label>
          <input id="calls" type="number" min="0" value="10000">
        </div>
        <div>
          <label for="cache">Prompt cache 命中率 %</label>
          <input id="cache" type="number" min="0" max="100" value="0">
        </div>
      </div>

      <label class="toggle" for="batch">
        <input type="checkbox" id="batch">
        <span>启用 Batch API（-50%，支持的服务商）</span>
      </label>
      <label class="toggle" for="cot">
        <input type="checkbox" id="cot" checked>
        <span>含推理模型 CoT 隐藏 token（×2~×5 输出估算）</span>
      </label>
    </div>

    <div class="card out" id="result">加载中…</div>
    <div class="warn" id="warn">正在读取定价数据…</div>
    <p class="sub" style="margin-top: 24px;">
      数据源 <span id="source">--</span> · 定价更新 <span id="updated">--</span>，以各厂官网为准 ·
      <a href="https://c8.fit" target="_blank" rel="noreferrer">c8.fit</a> ·
      不转售 API key，仅做成本估算
    </p>
  </div>

  <script>
    const CHARS_PER_TOK = 4;
    const COT_PATTERN = /r1|opus|sonnet|o[0-9]|reason|think/i;
    const BATCH_SUPPORTED_PATTERN = /openai|anthropic|gemini|google/i;
    const PRICING_URL = "./pricing.json";

    function estTokens(text) {
      const normalized = (text || "").trim();
      if (!normalized) {
        return 0;
      }
      return Math.max(1, Math.round(normalized.length / CHARS_PER_TOK));
    }

    function numberValue(id) {
      const raw = Number.parseFloat(document.getElementById(id).value);
      return Number.isFinite(raw) ? raw : 0;
    }

    function formatMoney(value, digits) {
      return "$" + value.toFixed(digits);
    }

    function loadPricing() {
      return fetch(PRICING_URL)
        .then(function (response) {
          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }
          return response.json();
        }).then(function (payload) {
          return {
            updated: payload.updated || "--",
            source: payload.source || "本地 pricing.json",
            sourceUrl: payload.sourceUrl || "",
            models: payload.models || []
          };
        });
    }

    loadPricing()
      .then(function (data) {
        const sel = document.getElementById("model");
        const resultEl = document.getElementById("result");
        const warnEl = document.getElementById("warn");
        const updatedEl = document.getElementById("updated");
        const sourceEl = document.getElementById("source");
        const searchEl = document.getElementById("modelSearch");
        let visibleModels = data.models.slice();

        updatedEl.textContent = data.updated || "--";
        sourceEl.innerHTML = data.sourceUrl
          ? '<a href="' + data.sourceUrl + '" target="_blank" rel="noreferrer">' + data.source + "</a>"
          : data.source;

        function renderModelOptions(keyword) {
          const query = (keyword || "").trim().toLowerCase();
          visibleModels = data.models.filter(function (model) {
            if (!query) {
              return true;
            }
            return (
              model.id.toLowerCase().indexOf(query) !== -1 ||
              model.provider.toLowerCase().indexOf(query) !== -1
            );
          });

          sel.innerHTML = "";
          visibleModels.forEach(function (model, index) {
            const option = document.createElement("option");
            option.value = String(index);
            option.textContent = model.provider + " · " + model.id + (model.free ? " · 免费层" : "");
            sel.appendChild(option);
          });

          if (!visibleModels.length) {
            const option = document.createElement("option");
            option.value = "0";
            option.textContent = "没有匹配的模型";
            sel.appendChild(option);
          }
        }

        renderModelOptions("");

        if (!data.models.length) {
          throw new Error("无可用模型数据");
        }

        function calc() {
          if (!visibleModels.length) {
            resultEl.textContent = "当前搜索条件下没有可计算的模型。";
            warnEl.textContent = "⚠ 请调整搜索词，或清空搜索框查看全部模型。";
            return;
          }

          const model = visibleModels[Number(sel.value) || 0];
          const manualInputTok = Math.max(0, Math.round(numberValue("inputTok")));
          const textInputTok = estTokens(document.getElementById("inp").value);
          const inTok = manualInputTok > 0 ? manualInputTok : textInputTok;
          const calls = Math.max(0, Math.round(numberValue("calls")));
          const cacheRate = Math.min(100, Math.max(0, numberValue("cache"))) / 100;
          const batch = document.getElementById("batch").checked;
          const cot = document.getElementById("cot").checked;
          const cotApplicable = COT_PATTERN.test(model.id);
          const batchSupported = BATCH_SUPPORTED_PATTERN.test(model.provider) || BATCH_SUPPORTED_PATTERN.test(model.id);

          let outTok = Math.max(0, Math.round(numberValue("outTok")));
          if (cot && cotApplicable) {
            outTok = Math.round(outTok * 3);
          }

          if (model.free) {
            resultEl.innerHTML =
              "<b>免费层</b>：" + model.provider + " / " + model.id +
              '<span class="free">FREE</span><br>' +
              "限额：" + (model.limit || "见官网") + "<br>" +
              "本次估算 token：input " + inTok + " / output " + outTok + " → <b>$0.00</b>（按免费额度内估算）" +
              '<div class="meta">ctx ' + model.ctx + " · updated " + (data.updated || "--") + "</div>";
            warnEl.textContent = "⚠ 免费层禁止转售 key / 商用中转，仅适合个人原型、测试与评估；正式使用前请复核官网限额。";
            return;
          }

          const cachedTok = Math.round(inTok * cacheRate);
          const uncachedTok = Math.max(0, inTok - cachedTok);
          const cachedPrice = typeof model.cached === "number" ? model.cached : model.input;

          let inCost = (uncachedTok * model.input + cachedTok * cachedPrice) / 1e6;
          let outCost = (outTok * model.output) / 1e6;
          if (batch && batchSupported) {
            inCost *= 0.5;
            outCost *= 0.5;
          }

          const perCall = inCost + outCost;
          const monthly = perCall * calls;
          const yearly = monthly * 12;

          resultEl.innerHTML =
            "模型：<b>" + model.provider + " / " + model.id + "</b> · ctx " + model.ctx + "<br>" +
            "单次：input " + inTok + " tok (cache " + cachedTok + ") + output " + outTok + " tok → <b>" + formatMoney(perCall, 6) + "</b><br>" +
            "月度 " + calls.toLocaleString("zh-CN") + " 次调用 → <b>" + formatMoney(monthly, 2) + "</b> · 年度 <b>" + formatMoney(yearly, 2) + "</b>" +
            '<div class="meta">input: ' + model.input + " / output: " + model.output + " / cached: " + cachedPrice + " USD / 1M tokens</div>";

          const warnings = [];
          if (cot && cotApplicable) {
            warnings.push("推理模型 CoT 隐藏 token 已按 ×3 估算，实际可能在 2~5× 之间");
          }
          if (cacheRate === 0) {
            warnings.push("未填 cache 命中率，可能漏算 prompt caching 折扣");
          }
          if (batch) {
            warnings.push(batchSupported ? "已按 Batch -50% 估算" : "当前模型通常不支持 Batch -50%，本次未应用折扣");
          }
          warnings.push("中文按 4 chars/tok 偏保守，真实 token 数通常更低，金额倾向高估");
          warnings.push("价格快照由 GitHub Actions 定时更新，页面本身不请求远端价格接口");
          warnings.push("价格仅供估算，使用前请以各家官网 pricing 页为准");
          warnEl.textContent = "⚠ " + warnings.join(" · ");
        }

        sel.addEventListener("change", calc);
        searchEl.addEventListener("input", function () {
          renderModelOptions(searchEl.value);
          calc();
        });
        ["inp", "inputTok", "outTok", "calls", "cache", "batch", "cot"].forEach(function (id) {
          const node = document.getElementById(id);
          node.addEventListener("input", calc);
          node.addEventListener("change", calc);
        });

        calc();
      })
      .catch(function (error) {
        document.getElementById("result").textContent = "定价数据加载失败：" + error.message;
        document.getElementById("warn").textContent = "⚠ 请确认当前静态目录中存在 cost/pricing.json，且构建产物已包含最新价格快照。";
      });
  </script>
</body>
</html>
